name : CD

on : 
    workflow_run : "CI" 
    workflows: ["CI"]
    types: [completed]

jobs: 
    deploy: 
    runs-on: ubuntu 

    steps:

      - uses: actions/checkout@v4
        
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: 
            cd ~/skillpulse
            git pull origin main
            docker compose pull
            docker compose up -d
            docker image prune -f
